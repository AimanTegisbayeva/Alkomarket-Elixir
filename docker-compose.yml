services:
  db:
    image: postgres:16-alpine
    container_name: django_db

    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: 1234

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin -d django_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: django_backend

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      DB_NAME: django_db
      DB_USER: Admin
      DB_PASSWORD: 1234
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/front
    container_name: react_frontend

    working_dir: /app

    command: npm run dev -- --host

    volumes:
      - ./frontend/front:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: